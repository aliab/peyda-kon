name: Release

# Push a tag like v1.2.0 to deploy to Cloudflare and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # A new cache name per release makes installed copies download the update.
      - name: Stamp release into service worker cache
        run: |
          sed -i "s/^const CACHE = .*/const CACHE = 'peyda-kon-${GITHUB_REF_NAME}';/" public/sw.js
          grep -q "peyda-kon-${GITHUB_REF_NAME}" public/sw.js

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --tag ${{ github.ref_name }} --message "Release ${{ github.ref_name }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Live: https://peyda-kon.aliab.workers.dev"
